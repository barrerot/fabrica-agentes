# ─────────────────────────────────────────────────────────────────────────────────────────────
# MAPA DE INSUMOS POR GATE — propuesta de M2 para el hotfix del agregador (grano de gate).
#
# PARA QUÉ: con `base_tip` != tip actual pero ANCESTRO confirmado, el agregador puede conservar
# los receipts cuyos INSUMOS no intersectan con el avance de main, y exigir re-corrida SOLO de los
# gates cuyos insumos sí intersectan. Hoy la regla es todo-o-nada y eso cuesta suites enteras
# (M2 perdió tres el 04-sep; la tabla M2-TABLA-DISJUNCION mide el caso de las cuatro congeladas).
#
# CÓMO SE DERIVÓ: leyendo lo que cada gate EJECUTA (TF_GATE_CMD_* del manifiesto) y lo que ese
# comando LEE de verdad (scripts/*.{sh,mjs,ts}, scripts/ci/*, package.json). No es una lista
# «razonable»: cada línea sale de un grep sobre el script del gate.
#
# CÓMO SE USA (propuesta): si `git diff --name-only <base_tip_receipt>..<tip_actual>` intersecta
# los globs de un gate ⇒ ese receipt es RANCIO y hay que re-correrlo. Si no intersecta ⇒ vale.
#
# FAIL-CLOSED, y esto es lo importante: un gate SIN entrada en este mapa NO se conserva jamás.
# Se re-corre. Un mapa incompleto debe costar tiempo, nunca falsos verdes. Y toda entrada de
# insumo universal (package-lock.json, node_modules) invalida a TODOS por diseño.
# ─────────────────────────────────────────────────────────────────────────────────────────────

# Insumos que invalidan CUALQUIER gate (dependencias y config de build/runtime).
TF_INPUTS_UNIVERSAL="package.json package-lock.json .nvmrc tsconfig.json next.config.ts"

TF_INPUTS_typecheck="src/** tests/** *.ts *.tsx tsconfig*.json"
TF_INPUTS_lint="src/** tests/** eslint.config.mjs *.ts *.tsx"
TF_INPUTS_build="src/** public/** messages/** next.config.ts postcss.config.* tailwind* src/app/globals.css"
TF_INPUTS_unit="src/** tests/unit/** vitest.config.ts"
TF_INPUTS_i18n="messages/**"
TF_INPUTS_flags="src/lib/feature-flags/** src/**"
TF_INPUTS_tenant="src/** messages/** supabase/migrations/** supabase/tests/** scripts/check-tenant-hygiene.sh"
TF_INPUTS_markdownlint="docs/**/*.md *.md .markdownlint*.json*"
TF_INPUTS_skills_package=".claude/skills/**"
TF_INPUTS_tests_manifest="supabase/tests/** scripts/check-tests-manifest.sh scripts/ci/run-db-guards-local.sh scripts/ci/run-money-pgtap.sh scripts/ci/test-tests-manifest-fail-propagation.sh"
TF_INPUTS_db_guards="supabase/** scripts/ci/run-db-guards-local.sh scripts/ci/run-money-pgtap.sh scripts/ci/lib/** scripts/ci/test-*.sh"
TF_INPUTS_integration="tests/integration/** src/** supabase/** scripts/ci/run-integration-local.sh scripts/ci/lib/** supabase/config.toml"
# Familias e2e: TODOS los shards comparten insumo (app + BD + wrapper). Se declara una vez y el
# agregador la aplica a cada `e2e-*:shard`.
TF_INPUTS_e2e="src/** tests/e2e/** supabase/** messages/** playwright*.config.ts scripts/ci/run-e2e-shard-local.sh scripts/ci/e2e-shards.json scripts/ci/lib/**"

# ─────────────────────────────────────────────────────────────────────────────────────────────
# TAL-5462 — EXCLUSIONES POR ÁREA (`TF_NOT_INPUTS_<gate>`), evaluadas DESPUÉS de las inclusiones.
#
# POR QUÉ EXCLUSIONES Y NO UNA LISTA DE INCLUSIONES MÁS FINA: `supabase/**` cubre hoy siete áreas
# (advisors, backfills, fixtures, functions, migrations, templates, tests) más `config.toml` y
# `seed.sql`. Si se sustituyera por una enumeración de las que SÍ son insumo, cualquier carpeta
# NUEVA bajo `supabase/` quedaría fuera en silencio — fail-OPEN. Con exclusiones, lo nuevo sigue
# cayendo en `supabase/**` y CADUCA (fail-closed); sólo se descuenta lo que está PROBADO que el
# gate no lee.
#
# CADA EXCLUSIÓN SALE DE UN GREP, no de una intuición (misma disciplina que las inclusiones):
#   · `supabase/tests/**` lo referencian EXCLUSIVAMENTE `scripts/ci/run-db-guards-local.sh` y
#     `scripts/ci/run-money-pgtap.sh`. Los envoltorios de e2e e integration
#     (`run-e2e-shard-local.sh`, `run-integration-local.sh`, `scripts/ci/lib/**`) NO lo mencionan:
#     ninguno de los dos ejecuta pgTAP. Un cambio en un fichero pgTAP no puede alterar su
#     resultado, así que arrastrarlos era caducación pura de más.
#
# COSTE MEDIDO de no tenerlo (2026-09-05/06): un PR que sólo tocaba `scripts/ci/run-money-pgtap.sh`
# y un `supabase/tests/*.sql` caducaba 29 de 37 gates — los 25 shards e2e entre ellos.
#
# Lo que NO se hace aquí, a propósito: partir la familia e2e por shard (pagos ≠ foro ≠ oso) según
# el área de `src/` tocada. Sería el recorte más grande, pero un shard importa código compartido de
# `src/`, así que conservar por familia sin un grafo de imports MEDIDO sería fail-open. Follow-up.
TF_NOT_INPUTS_e2e="supabase/tests/**"
TF_NOT_INPUTS_integration="supabase/tests/**"

# ─────────────────────────────────────────────────────────────────────────────────────────────
# TAL-5462 — GATES QUE SIEMPRE RE-CORREN, DECLARADOS (no por ausencia).
#
# Un gate sin entrada en el mapa ya re-corría siempre (fail-closed del cargador), así que el
# comportamiento no cambia. Lo que cambia es que deja de ser SILENCIOSO: el arnés cruza los
# `TF_GATE_CMD_*` del manifiesto contra este fichero y se pone ROJO si aparece un gate que no esté
# ni mapeado ni declarado aquí. Antes, olvidarse de mapear un gate nuevo no lo notaba nadie.
#
#   · carveout_check — hoy APAGADO en el manifiesto de Academy (`TF_CARVEOUT_INERT_GATE=""`,
#     TAL-3439). No se le inventa una lista de insumos que nadie ha medido: se declara que
#     siempre re-corre. Cuando el carve-out se reactive, o se mide su superficie y se le da
#     entrada, o se deja aquí a conciencia.
TF_ALWAYS_RERUN="carveout_check"
