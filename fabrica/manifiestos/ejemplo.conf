# Manifiesto de proyecto — EJEMPLO (referencia del formato; sustituye los valores por los tuyos)
# Credenciales SIEMPRE POR NOMBRE: el valor vive en el .env.local del entorno, jamás aquí.
# Los repos pueden pertenecer a ORGANIZACIONES DISTINTAS: cada proyecto declara sus propias
# identidades GH/CR, y el pool de cuentas de agentes que alimenta su fábrica.
TF_PROJECT="ejemplo"
## Repo de producto
TF_REPO_URL="https://github.com/example-org/Producto-A.git"
TF_REPO_DIR="Producto A 2026"
TF_GH_ORG="example-org"
## Identidades GitHub (por nombre de variable)
TF_GH_TOKEN_NAME="GITHUB_TOKEN"
TF_GH_MERGER_TOKEN_NAMES="GH_TOKEN_MERGER_A GH_TOKEN_MERGER_B"
## CodeRabbit (suscripción POR ORGANIZACIÓN; solo perfil Mergeador)
TF_CR_KEY_NAMES="CODERABBIT_API_KEY_MERGER_A CODERABBIT_API_KEY_MERGER_B"
## Cuentas de agentes asignadas a esta fábrica (aliases — pozos del ledger; sin valores)
TF_CLAUDE_ACCOUNT_POOL="pool-a pool-b"
TF_CODEX_ACCOUNT_POOL="pool-a"
## Linear
TF_LINEAR_TOKEN_NAME="LINEAR_API_KEY"
TF_LINEAR_TEAM_KEY="ABC"
## Gates 100% locales (motor v2): LISTA NOMBRADA de gates + un comando por gate.
TF_GATE_IDS="typecheck lint build unit markdownlint tenant db-guards integration"
TF_GATE_CMD_typecheck="npm run typecheck"
TF_GATE_CMD_lint="npm run lint"
TF_GATE_CMD_build="npm run build"
TF_GATE_CMD_unit="npm run test:unit"
TF_GATE_CMD_markdownlint="npm run md:check"
TF_GATE_CMD_tenant="npm run tenant:check"
TF_GATE_CMD_db_guards="bash scripts/ci/run-db-guards-local.sh"
TF_GATE_CMD_integration="bash scripts/ci/run-integration-local.sh"
## E2E por shard — el conjunto vive en el REGISTRO del repo (fuente única).
TF_E2E_FAMILIES="e2e-core"
TF_E2E_WRAPPER="bash scripts/ci/run-e2e-shard-local.sh"
TF_SHARDS_REGISTRY="scripts/ci/e2e-shards.json"
## Base de datos
TF_DB_GATE="always"
TF_MIGRATIONS_DIR="supabase/migrations"
TF_INSTALL="npm ci --no-audit --no-fund"
## Validador canónico de rama (lo corre el AGREGADOR desde base_sha)
TF_BRANCH_VALIDATOR="scripts/github/validar-rama-pr.sh"
## Tokens EXACTOS del campo surfaces del HANDOFF (fuente única)
TF_SENSITIVE_SURFACES="commerce webhooks auth migraciones credenciales"
## Carve-out docs-only: APAGADO por defecto (encenderlo exige ratificación durable)
TF_CARVEOUT_DOCS_ONLY="0"
TF_CARVEOUT_KEEP_GATES="tenant markdownlint"
TF_CARVEOUT_PATHS="docs/"
TF_CARVEOUT_INERT_GATE=""
