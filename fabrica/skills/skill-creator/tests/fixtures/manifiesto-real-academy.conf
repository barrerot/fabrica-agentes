# Fixture sintético del formato completo de manifiesto, basado en la captura f55bdfc5 de 2026-07-23.
# Manifiesto de proyecto — Academia Ejemplo 2.0 (proyecto sintético, referencia del formato)
# Credenciales SIEMPRE POR NOMBRE: el valor vive en el .env.local del entorno, jamás aquí.
# Los repos pueden pertenecer a ORGANIZACIONES DISTINTAS: cada proyecto declara sus propias
# identidades GH/CR, y el pool de cuentas Claude/Codex que alimenta su fábrica.

TF_PROJECT="academy"

## Repo de producto
TF_REPO_URL="https://github.com/org-ejemplo/Academia-Ejemplo-2.0.git"
TF_REPO_DIR="Academia Ejemplo 2026"
TF_GH_ORG="org-ejemplo"

## Identidades GitHub (por nombre de variable)
TF_GH_TOKEN_NAME="GITHUB_TOKEN"                                   # canales de producción (scope: repo del proyecto)
TF_GH_MERGER_TOKEN_NAMES="GH_TOKEN_MERGER_A GH_TOKEN_MERGER_B"    # identidades A/B del Mergeador (escalera CR)

## CodeRabbit (suscripción POR ORGANIZACIÓN — el repo debe estar habilitado en el dashboard CR de su org)
TF_CR_KEY_NAMES="CODERABBIT_API_KEY_MERGER_A CODERABBIT_API_KEY_MERGER_B"  # solo perfil Mergeador

## Cuentas de agentes asignadas a esta fábrica (aliases — pozos del ledger, derivados de sus claves)
TF_CLAUDE_ACCOUNT_POOL="ok-campus soporte"    # aliases, se cosechan de los pozos; sin valores
TF_CODEX_ACCOUNT_POOL="talent-network"

## Linear
TF_LINEAR_TOKEN_NAME="LINEAR_API_KEY"
TF_LINEAR_TEAM_KEY="TAL"
TF_LINEAR_INITIATIVE_ID="cfcbfe90-efd4-4faa-a702-d2532d64d9db"       # producto
TF_LINEAR_META_INITIATIVE_ID="e445b88c-292b-4a7f-a4bd-0866b635e075"  # capa meta
TF_LINEAR_COORDINATION_PROJECT_ID="5d829bf6-9a6e-4be0-99ef-fe0c0e4e4228"

## Gates y datos — 100% LOCALES (motor v2, TAL-2288/TAL-2286: Actions OFF por presupuesto)
# LISTA NOMBRADA de gates (v2 no acepta cadenas opacas). Inventario check-de-Actions → gate
# local (cobertura íntegra, sin degradación): validar-flujo-pr → branch-name (agregador) +
# tenant; validar-build → typecheck/lint/build/unit (+i18n/flags, FORTALECIMIENTO nuevo);
# db-guards → db-guards; integration → integration; e2e-ola3/e2e-pagos → familias del registro.
TF_GATE_IDS="typecheck lint build unit i18n flags tenant db-guards integration"
TF_GATE_CMD_typecheck="npm run typecheck"
TF_GATE_CMD_lint="npm run lint"
TF_GATE_CMD_build="npm run build"
TF_GATE_CMD_unit="npm run test:unit"
TF_GATE_CMD_i18n="npm run i18n:check"
TF_GATE_CMD_flags="npm run flags:check"
TF_GATE_CMD_tenant="npm run tenant:check"
# Wrappers canónicos del PRODUCTO (dueños de su stack Supabase — ownership único; el motor
# no ejecuta lifecycle de BD). Corren SOLO en runners sin credenciales.
TF_GATE_CMD_db_guards="bash scripts/ci/run-db-guards-local.sh"
TF_GATE_CMD_integration="bash scripts/ci/run-integration-local.sh"
## E2E por shard — el conjunto vive en el REGISTRO del repo (fuente única; el manifiesto lo
## referencia, NO enumera shards). Anti-reducción: el registro de base es el mínimo confiable.
TF_E2E_FAMILIES="e2e-ola3 e2e-pagos"
TF_E2E_WRAPPER="bash scripts/ci/run-e2e-shard-local.sh"
TF_SHARDS_REGISTRY="scripts/ci/e2e-shards.json"
## Instalación de deps (sin autodetección silenciosa) y política de BD.
TF_INSTALL="npm ci --no-audit --no-fund"
# SIN TF_ENV_COPY (B1 audit TAL-2293): los gates reproducen los jobs de Actions, que corrían
# SIN .env.local (env explícito; los wrappers derivan el env de Supabase efímero en runtime).
# Copiar env no versionado a un árbol que ejecuta código del PR = canal de exfiltración; el
# motor lo PROHÍBE en modo sealed aunque un manifiesto lo declare.
TF_DB_GATE="always"                               # SIEMPRE hasta ratificación explícita del lead: el job
                                                  # db-guards de Actions corría en todo PR y cubre también
                                                  # tests SQL/baselines/scripts de seguridad que el diff de
                                                  # migraciones no detecta (B3-rev3 del plan TAL-2288).
TF_MIGRATIONS_DIR="supabase/migrations"
TF_BRANCH_VALIDATOR="scripts/github/validar-rama-pr.sh"   # lo ejecuta el agregador DESDE base_sha, sin credenciales
TF_SUPABASE_TOKEN_NAME="SUPABASE_ACCESS_TOKEN"   # "none" si no aplica
TF_MIGRATIONS="supabase"                          # supabase | none — serialización de slots si != none
# Tokens EXACTOS del campo `surfaces` del HANDOFF (decisión 7 del CEO: el manifiesto es la
# fuente única del vocabulario; verify-handoff.sh lo LEE de aquí — reconciliado a los tokens
# vigentes del producto para NO invalidar ningún HANDOFF publicado).
TF_SENSITIVE_SURFACES="commerce auth-rls migraciones llm-costes seguridad credenciales"
