[Service]
# El '--cleanup' de tailscaled falla en contenedor unprivileged (limpieza de rutas/DNS del kernel).
# Lo hacemos NO-FATAL (prefijo '-') para que el daemon arranque en modo userspace-networking.
ExecStartPre=
ExecStartPre=-/usr/sbin/tailscaled --cleanup
ExecStopPost=
ExecStopPost=-/usr/sbin/tailscaled --cleanup
